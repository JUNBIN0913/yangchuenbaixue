<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>陽春白雪KTV｜掃碼點歌</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Monoton&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#0A0E27; --bg-panel:#131832; --bg-panel-2:#1B2147;
    --magenta:#FF2A6D; --cyan:#05D9E8; --gold:#FFD23F;
    --text:#F2F2F7; --text-muted:#8A8FB8; --line: rgba(138,143,184,0.18);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh;
    background: radial-gradient(120% 60% at 50% 0%, #171d40 0%, var(--bg-deep) 60%);
    color:var(--text); font-family:"Noto Sans TC", sans-serif;
    padding-bottom:90px;
  }
  header{
    position:sticky; top:0; z-index:10;
    background:rgba(10,14,39,0.92); backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);
    padding:14px 16px 10px;
  }
  .logo{ font-family:"Monoton", cursive; font-size:18px; color:var(--cyan);
    text-shadow:0 0 8px rgba(5,217,232,0.6); }
  .search{
    margin-top:10px; display:flex; gap:8px;
  }
  .search input{
    flex:1; padding:11px 14px; border-radius:10px; border:1px solid var(--line);
    background:var(--bg-panel-2); color:var(--text); font-size:15px; font-family:inherit;
  }
  .search input:focus{ outline:none; border-color:var(--cyan); }

  main{ padding:14px 16px; }

  .crumb{ display:flex; gap:8px; align-items:center; margin-bottom:12px; font-size:13px; color:var(--text-muted); flex-wrap:wrap;}
  .crumb button{ background:none; border:none; color:var(--cyan); font-weight:700; font-size:13px; padding:0;}

  .cat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .cat-card{
    cursor:pointer; border-radius:14px; padding:22px 14px; text-align:center;
    font-weight:900; font-size:18px; border:1px solid var(--line);
    background:linear-gradient(150deg, var(--bg-panel-2), #0f1330);
  }
  .cat-card small{ display:block; font-size:11px; color:var(--text-muted); margin-top:6px; font-weight:500;}
  .cat-card.c-華語{ color:var(--magenta); } .cat-card.c-方言{ color:var(--gold); }
  .cat-card.c-韓語{ color:var(--cyan); } .cat-card.c-西洋{ color:#B98CFF; }

  .sub-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .sub-card{ cursor:pointer; border-radius:12px; padding:16px 10px; text-align:center; font-weight:700;
    border:1px solid var(--line); background:var(--bg-panel-2); }

  .song-list{ display:flex; flex-direction:column; gap:8px; }
  .song-row{
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    background:var(--bg-panel-2); border:1px solid var(--line); border-radius:12px; padding:12px 14px;
  }
  .song-row .t{ font-weight:700; font-size:15px; }
  .song-row .a{ font-size:12px; color:var(--text-muted); margin-top:2px;}
  .song-row .tag{ font-size:11px; color:var(--text-muted); margin-top:3px;}
  .add-btn{
    flex-shrink:0; font-size:13px; font-weight:900; color:var(--bg-deep); background:var(--gold);
    border:none; border-radius:10px; padding:8px 14px;
  }
  .empty{ text-align:center; color:var(--text-muted); padding:30px 0; font-size:14px;}

  .queue-panel{
    margin-top:22px; background:var(--bg-panel); border:1px solid var(--line); border-radius:14px; padding:14px 16px;
  }
  .queue-panel h3{ margin:0 0 10px; font-size:13px; letter-spacing:1px; color:var(--text-muted); }
  .queue-panel li{
    list-style:none; display:flex; justify-content:space-between; gap:10px;
    padding:7px 0; font-size:14px; border-top:1px solid var(--line);
  }
  .queue-panel li:first-child{ border-top:none; }
  .queue-panel .idx{ color:var(--cyan); font-weight:900; margin-right:6px; }
  .queue-panel .now{ color:var(--gold); font-weight:900; margin-right:6px; }

  .toast{
    position:fixed; left:50%; bottom:20px; transform:translateX(-50%) translateY(20px);
    background:var(--gold); color:#141428; font-weight:900; font-size:14px;
    padding:10px 20px; border-radius:999px; opacity:0; pointer-events:none;
    transition: all .25s ease; box-shadow:0 10px 30px rgba(0,0,0,0.4); z-index:50; white-space:nowrap;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>

<header>
  <span class="logo">陽春白雪KTV · 掃碼點歌</span>
  <div class="search">
    <input id="searchInput" placeholder="搜尋歌名或歌手…" oninput="onSearch()" />
  </div>
</header>

<main>
  <div class="crumb" id="crumb"></div>
  <div id="browseArea"></div>

  <div class="queue-panel">
    <h3>目前排隊清單</h3>
    <ul id="queueList"><li class="empty" style="padding:6px 0;">目前沒有排隊中的點歌</li></ul>
  </div>
</main>

<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="ktv-utils.js"></script>
<script>
let allSongs = [];
let navPath = { lang:null, type:null };
let searchTerm = "";

db.collection("songs").onSnapshot(snap => {
  allSongs = [];
  snap.forEach(doc => allSongs.push({ id: doc.id, ...doc.data() }));
  render();
});

db.collection("queue").orderBy("order","asc").onSnapshot(snap => {
  const items = [];
  snap.forEach(doc => items.push(doc.data()));
  const list = document.getElementById("queueList");
  if (items.length === 0){
    list.innerHTML = '<li class="empty" style="padding:6px 0;">目前沒有排隊中的點歌</li>';
    return;
  }
  list.innerHTML = items.map((q,i) =>
    i===0
      ? `<li><span><span class="now">▶ 播放中</span>${escapeHtml(q.title)}</span><span>${escapeHtml(q.artist||"")}</span></li>`
      : `<li><span><span class="idx">${i}</span>${escapeHtml(q.title)}</span><span>${escapeHtml(q.artist||"")}</span></li>`
  ).join("");
});

function onSearch(){
  searchTerm = document.getElementById("searchInput").value.trim();
  render();
}

function render(){
  const crumb = document.getElementById("crumb");
  const area = document.getElementById("browseArea");

  if (searchTerm){
    crumb.innerHTML = `<span>搜尋結果：「${escapeHtml(searchTerm)}」</span>`;
    const results = allSongs.filter(s =>
      (s.title||"").includes(searchTerm) || (s.artist||"").includes(searchTerm)
    );
    area.innerHTML = songListHtml(results);
    return;
  }

  if (!navPath.lang){
    crumb.innerHTML = "";
    area.innerHTML = `<div class="cat-grid">` + LANGUAGE_CATS.map(l =>
      `<div class="cat-card c-${l}" onclick="selectLang('${l}')">${l}<small>${countByLang(l)} 首</small></div>`
    ).join("") + `</div>`;
    return;
  }

  if (!navPath.type){
    crumb.innerHTML = `<button onclick="backToLang()">← 分類</button><span>／ ${navPath.lang}</span>`;
    area.innerHTML = `<div class="sub-grid">` + SINGER_TYPES.map(t =>
      `<div class="sub-card" onclick="selectType('${t}')">${t}</div>`
    ).join("") + `</div>`;
    return;
  }

  crumb.innerHTML = `<button onclick="backToLang()">← 分類</button><span>／ ${navPath.lang} ／ ${navPath.type}</span>`;
  const songs = allSongs.filter(s => s.language === navPath.lang && s.singerType === navPath.type);
  area.innerHTML = songListHtml(songs);
}

function songListHtml(songs){
  if (songs.length === 0) return `<div class="empty">沒有符合的歌曲</div>`;
  return `<div class="song-list">` + songs.map(s =>
    `<div class="song-row">
       <div><div class="t">${escapeHtml(s.title)}</div><div class="a">${escapeHtml(s.artist||"")}</div>
       <div class="tag">${s.language} · ${s.singerType}</div></div>
       <button class="add-btn" onclick="addToQueue('${s.id}')">加入點歌</button>
     </div>`
  ).join("") + `</div>`;
}

function countByLang(l){ return allSongs.filter(s => s.language === l).length; }
function selectLang(l){ navPath = { lang:l, type:null }; render(); }
function selectType(t){ navPath.type = t; render(); }
function backToLang(){ navPath = { lang:null, type:null }; render(); }

function addToQueue(songId){
  const song = allSongs.find(s => s.id === songId);
  if (!song) return;
  db.collection("queue").add({
    songId: song.id,
    title: song.title,
    artist: song.artist || "",
    urlOriginal: song.urlOriginal || "",
    urlCover: song.urlCover || "",
    playingSource: "original",
    order: Date.now(),
    addedAt: firebase.firestore.FieldValue.serverTimestamp(),
    requestedBy: "手機掃碼點歌"
  }).then(()=> showToast(`已加入點歌：${song.title}`));
}

function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(()=> t.classList.remove("show"), 2200);
}
</script>
</body>
</html>

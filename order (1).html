<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>陽春白雪KTV｜掃碼點歌</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Monoton&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#0A0E27; --bg-panel:#131832; --bg-panel-2:#1B2147;
    --magenta:#FF2A6D; --cyan:#05D9E8; --gold:#FFD23F;
    --text:#F2F2F7; --text-muted:#8A8FB8; --line: rgba(138,143,184,0.18);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh;
    background: radial-gradient(120% 60% at 50% 0%, #171d40 0%, var(--bg-deep) 60%);
    color:var(--text); font-family:"Noto Sans TC", sans-serif;
    padding-bottom:96px;
  }
  header{
    position:sticky; top:0; z-index:10;
    background:rgba(10,14,39,0.92); backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);
    padding:14px 16px 10px;
  }
  .logo{ font-family:"Monoton", cursive; font-size:18px; color:var(--cyan);
    text-shadow:0 0 8px rgba(5,217,232,0.6); }
  .search{
    margin-top:10px; display:flex; gap:8px;
  }
  .search input{
    flex:1; padding:11px 14px; border-radius:10px; border:1px solid var(--line);
    background:var(--bg-panel-2); color:var(--text); font-size:15px; font-family:inherit;
  }
  .search input:focus{ outline:none; border-color:var(--cyan); }

  main{ padding:14px 16px; }

  .crumb{ display:flex; gap:8px; align-items:center; margin-bottom:12px; font-size:13px; color:var(--text-muted); flex-wrap:wrap;}
  .crumb button{ background:none; border:none; color:var(--cyan); font-weight:700; font-size:13px; padding:0;}

  .cat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .cat-card{
    cursor:pointer; border-radius:14px; padding:22px 14px; text-align:center;
    font-weight:900; font-size:18px; border:1px solid var(--line);
    background:linear-gradient(150deg, var(--bg-panel-2), #0f1330);
  }
  .cat-card small{ display:block; font-size:11px; color:var(--text-muted); margin-top:6px; font-weight:500;}
  .cat-card.c-華語{ color:var(--magenta); } .cat-card.c-方言{ color:var(--gold); }
  .cat-card.c-韓語{ color:var(--cyan); } .cat-card.c-西洋{ color:#B98CFF; }
  .cat-card.c-日語{ color:#5FE0A5; }
  .cat-card.cat-new{ background:linear-gradient(150deg, #3a2a12, #1B2147); border-color:var(--gold); color:var(--gold); }

  .sub-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .sub-card{ cursor:pointer; border-radius:12px; padding:16px 10px; text-align:center; font-weight:700;
    border:1px solid var(--line); background:var(--bg-panel-2); }

  .song-list{ display:flex; flex-direction:column; gap:8px; }
  .song-row{
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    background:var(--bg-panel-2); border:1px solid var(--line); border-radius:12px; padding:12px 14px;
  }
  .song-row .t{ font-weight:700; font-size:15px; }
  .song-row .a{ font-size:12px; color:var(--text-muted); margin-top:2px;}
  .song-row .tag{ font-size:11px; color:var(--text-muted); margin-top:3px;}
  .add-btn{
    flex-shrink:0; font-size:13px; font-weight:900; color:var(--bg-deep); background:var(--gold);
    border:none; border-radius:10px; padding:8px 14px;
  }
  .empty{ text-align:center; color:var(--text-muted); padding:30px 0; font-size:14px;}

  .queue-panel{
    margin-top:22px; background:var(--bg-panel); border:1px solid var(--line); border-radius:14px; padding:14px 16px;
  }
  .queue-panel h3{ margin:0 0 10px; font-size:13px; letter-spacing:1px; color:var(--text-muted); }
  .queue-panel li{
    list-style:none; display:flex; justify-content:space-between; align-items:center; gap:10px;
    padding:9px 0; font-size:14px; border-top:1px solid var(--line);
  }
  .queue-panel li:first-child{ border-top:none; }
  .queue-panel .idx{ color:var(--cyan); font-weight:900; margin-right:6px; }
  .queue-panel .now{ color:var(--gold); font-weight:900; margin-right:6px; }
  .queue-panel .remove-btn{
    flex-shrink:0; border:none; background:none; color:var(--text-muted); font-size:13px;
    cursor:pointer; font-family:inherit;
  }
  .queue-panel .remove-btn:hover{ color:var(--magenta); }

  .remote-panel{
    display:flex; flex-direction:column; gap:14px;
  }
  .remote-card{
    background:var(--bg-panel); border:1px solid var(--line); border-radius:14px; padding:18px 16px;
    text-align:center;
  }
  .remote-card h3{ margin:0 0 4px; font-size:14px; }
  .remote-card p{ margin:0 0 14px; font-size:12px; color:var(--text-muted); line-height:1.6; }
  .volume-row{ display:flex; align-items:center; justify-content:center; gap:16px; }
  .remote-btn{
    width:64px; height:64px; border-radius:50%; border:none; cursor:pointer;
    font-size:24px; font-weight:900; background:var(--bg-panel-2); color:var(--text);
    border:1px solid var(--line);
  }
  .remote-btn:active{ transform:scale(0.94); }
  .remote-btn.skip{
    width:auto; height:auto; border-radius:12px; padding:16px 28px; font-size:16px;
    background:var(--magenta); color:#fff;
  }

  .bottom-nav{
    position:fixed; left:0; right:0; bottom:0; z-index:20;
    display:flex; background:var(--bg-panel); border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom, 0);
  }
  .nav-btn{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
    padding:10px 0 8px; background:none; border:none; color:var(--text-muted);
    font-family:inherit; font-size:12px; font-weight:700; cursor:pointer;
  }
  .nav-btn .icon{ font-size:20px; }
  .nav-btn.active{ color:var(--cyan); }

  .toast{
    position:fixed; left:50%; bottom:20px; transform:translateX(-50%) translateY(20px);
    background:var(--gold); color:#141428; font-weight:900; font-size:14px;
    padding:10px 20px; border-radius:999px; opacity:0; pointer-events:none;
    transition: all .25s ease; box-shadow:0 10px 30px rgba(0,0,0,0.4); z-index:50; white-space:nowrap;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>

<header>
  <span class="logo">陽春白雪KTV · 掃碼點歌</span>
  <div class="search" id="searchWrap">
    <input id="searchInput" placeholder="搜尋歌名或歌手…" oninput="onSearch()" />
  </div>
</header>

<main>
  <div id="tabContent"></div>
</main>

<nav class="bottom-nav">
  <button class="nav-btn" id="navRemote" onclick="switchMainTab('remote')"><span class="icon">🎛️</span>遙控</button>
  <button class="nav-btn" id="navQueue" onclick="switchMainTab('queue')"><span class="icon">📋</span>已點</button>
  <button class="nav-btn active" id="navOrder" onclick="switchMainTab('order')"><span class="icon">🎵</span>點歌</button>
</nav>

<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="ktv-utils.js"></script>
<script src="stroke-data.js"></script>
<script>
let allSongs = [];
let queueDocs = [];
let navPath = { lang:null, type:null };
let searchTerm = "";
let mainTab = "order"; // 'order' | 'queue' | 'remote'

// 先畫一次空狀態畫面架構，避免 Firebase 尚未設定好時整頁空白
renderMain();

try{
  db.collection("songs").onSnapshot(snap => {
    allSongs = [];
    snap.forEach(doc => allSongs.push({ id: doc.id, ...doc.data() }));
    if (mainTab === "order") renderMain();
  }, err => {
    console.warn("songs 讀取失敗，請確認 firebase-config.js 是否已填入正確設定：", err);
  });

  db.collection("queue").orderBy("order","asc").onSnapshot(snap => {
    queueDocs = [];
    snap.forEach(doc => queueDocs.push({ id: doc.id, ...doc.data() }));
    if (mainTab === "queue") renderMain();
  }, err => {
    console.warn("queue 讀取失敗，請確認 firebase-config.js 是否已填入正確設定：", err);
  });
}catch(e){
  console.warn("Firebase 尚未正確設定，目前僅顯示畫面架構：", e);
}

function switchMainTab(tab){
  mainTab = tab;
  document.getElementById("navOrder").classList.toggle("active", tab === "order");
  document.getElementById("navQueue").classList.toggle("active", tab === "queue");
  document.getElementById("navRemote").classList.toggle("active", tab === "remote");
  document.getElementById("searchWrap").style.display = tab === "order" ? "flex" : "none";
  renderMain();
}

function renderMain(){
  if (mainTab === "queue") return renderQueueTab();
  if (mainTab === "remote") return renderRemoteTab();
  return renderOrderTab();
}

function onSearch(){
  searchTerm = document.getElementById("searchInput").value.trim();
  renderMain();
}

function renderOrderTab(){
  const el = document.getElementById("tabContent");

  if (searchTerm){
    const term = searchTerm.toLowerCase();
    const results = allSongs.filter(s =>
      (s.title||"").toLowerCase().includes(term) || (s.artist||"").toLowerCase().includes(term)
    );
    el.innerHTML = `<div class="crumb">搜尋結果：「${escapeHtml(searchTerm)}」</div>` + songListHtml(results);
    return;
  }

  if (!navPath.lang){
    el.innerHTML = `<div class="crumb"></div><div class="cat-grid">` +
      `<div class="cat-card cat-new" onclick="selectNewSongs()">🆕 本月新歌</div>` +
      LANGUAGE_CATS.map(l =>
        `<div class="cat-card c-${l}" onclick="selectLang('${l}')">${l}</div>`
      ).join("") + `</div>`;
    return;
  }

  if (navPath.lang === "__NEW__"){
    const songs = allSongs.filter(s => s.isNewSong);
    el.innerHTML = `<div class="crumb"><button onclick="backToLang()">← 分類</button><span>／ 本月新歌</span></div>` + songListHtml(songs);
    return;
  }

  if (!navPath.type){
    el.innerHTML = `<div class="crumb"><button onclick="backToLang()">← 分類</button><span>／ ${navPath.lang}</span></div>` +
      `<div class="sub-grid">` + SINGER_TYPES.map(t =>
        `<div class="sub-card" onclick="selectType('${t}')">${t}</div>`
      ).join("") + `</div>`;
    return;
  }

  const songs = allSongs.filter(s => s.language === navPath.lang && s.singerType === navPath.type);
  el.innerHTML = `<div class="crumb"><button onclick="backToLang()">← 分類</button><span>／ ${navPath.lang} ／ ${navPath.type}</span></div>` +
    songListHtml(songs);
}

function songListHtml(songs){
  if (songs.length === 0) return `<div class="empty">沒有符合的歌曲</div>`;
  songs = [...songs].sort(compareSongsByTitleAndStrokes);
  return `<div class="song-list">` + songs.map(s =>
    `<div class="song-row">
       <div><div class="t">${escapeHtml(s.title)}</div><div class="a">${escapeHtml(s.artist||"")}</div>
       <div class="tag">${s.language} · ${s.singerType}</div></div>
       <button class="add-btn" onclick="addToQueue('${s.id}')">加入點歌</button>
     </div>`
  ).join("") + `</div>`;
}

function renderQueueTab(){
  const el = document.getElementById("tabContent");
  if (queueDocs.length === 0){
    el.innerHTML = `<div class="queue-panel"><h3>目前排隊清單</h3><div class="empty" style="padding:10px 0;">目前沒有排隊中的點歌</div></div>`;
    return;
  }
  el.innerHTML = `<div class="queue-panel"><h3>目前排隊清單</h3><ul>` +
    queueDocs.map((q,i) => `
      <li>
        <span>${i===0 ? '<span class="now">▶ 播放中</span>' : `<span class="idx">${i}</span>`}${escapeHtml(q.title)}
          <span style="color:var(--text-muted); font-size:12px;"> ${escapeHtml(q.artist||"")}</span></span>
        ${i===0 ? "" : `<button class="remove-btn" onclick="removeFromQueue('${q.id}')">移除</button>`}
      </li>
    `).join("") + `</ul></div>`;
}

function removeFromQueue(id){
  db.collection("queue").doc(id).delete().then(()=> showToast("已移除該首點歌"));
}

function renderRemoteTab(){
  const el = document.getElementById("tabContent");
  el.innerHTML = `
    <div class="remote-panel">
      <div class="remote-card">
        <h3>🔊 音量</h3>
        <p>僅對 YouTube 來源的歌曲有效。<br/>Bilibili／Odysee 沒有開放外部音量控制，調整不會有反應。</p>
        <div class="volume-row">
          <button class="remote-btn" onclick="sendRemoteCommand('volumeDown')">－</button>
          <button class="remote-btn" onclick="sendRemoteCommand('volumeUp')">＋</button>
        </div>
      </div>
      <div class="remote-card">
        <h3>⏭ 切歌</h3>
        <p>跳過目前播放中的歌曲，換下一首排隊中的歌。</p>
        <button class="remote-btn skip" onclick="sendRemoteCommand('skip')">跳過目前歌曲</button>
      </div>
    </div>
  `;
}

function sendRemoteCommand(action){
  db.collection("remoteControl").doc("cmd").set({
    action: action,
    ts: firebase.firestore.FieldValue.serverTimestamp()
  }).then(()=>{
    const labels = { skip:"已送出切歌指令", volumeUp:"已送出音量＋指令", volumeDown:"已送出音量－指令" };
    showToast(labels[action] || "已送出指令");
  }).catch(()=> showToast("指令送出失敗，請稍後再試"));
}

function countByLang(l){ return allSongs.filter(s => s.language === l).length; }
function selectLang(l){ navPath = { lang:l, type:null }; renderMain(); }
function selectNewSongs(){ navPath = { lang:"__NEW__", type:null }; renderMain(); }
function selectType(t){ navPath.type = t; renderMain(); }
function backToLang(){ navPath = { lang:null, type:null }; renderMain(); }

function addToQueue(songId){
  const song = allSongs.find(s => s.id === songId);
  if (!song) return;
  db.collection("queue").add({
    songId: song.id,
    title: song.title,
    artist: song.artist || "",
    urlOriginal: song.urlOriginal || "",
    urlCover: song.urlCover || "",
    playingSource: "original",
    order: Date.now(),
    addedAt: firebase.firestore.FieldValue.serverTimestamp(),
    requestedBy: "手機掃碼點歌"
  }).then(()=> showToast(`已加入點歌：${song.title}`));
}

function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(()=> t.classList.remove("show"), 2200);
}
</script>
</body>
</html>
